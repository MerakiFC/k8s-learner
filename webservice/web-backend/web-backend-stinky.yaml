# web-backend-stinky.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-backend-stinky
  namespace: default
  labels:
    app: fc-web-test
    role: backend
    project: stinky
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fc-web-test
      role: backend
      project: stinky
  template:
    metadata:
      labels:
        app: fc-web-test
        role: backend
        project: stinky
    spec:
      containers:
      - name: http-echo
        image: hashicorp/http-echo:0.2.3
        args:
        - "-text=Hi, Stinky! You stink!"
        - "-listen=:8080"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-backend-stinky-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: fc-web-test
    role: backend
    project: stinky
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
