# web-backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-backend
  namespace: default
  labels:
    app: fc-web-test
    role: backend

spec:
  replicas: 2
  selector:
    matchLabels:
      app: fc-web-test
      role: backend
  template:
    metadata:
      labels:
        app: fc-web-test
        role: backend
    spec:
      containers:
      - name: http-echo
        image: hashicorp/http-echo:0.2.3
        args:
        - "-text=Data exfil initiated..."
        - "-listen=:8080"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-backend-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: fc-web-test
    role: backend
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP