services:
  splunk-proxy:
    image: nginx:alpine
    container_name: splunk-proxy
    restart: unless-stopped
    networks:
      - kind
    ports:
      - "${HOST_LAN_IP}:8443:8443"
    environment:
      - SPLUNK_GATEWAY_IP=${SPLUNK_GATEWAY_IP}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    volumes:
      - ./templates/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      
networks:
  kind:
    external: true