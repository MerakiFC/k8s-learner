apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: splunk-gateway
  namespace: splunk
spec:
  gatewayClassName: cilium
  listeners:
    - name: splunk-https
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - name: splunk-gateway-cert
      allowedRoutes:
        namespaces:
          from: Same